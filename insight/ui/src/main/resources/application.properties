spring.application.name=insight-ui
spring.thymeleaf.cache=true
server.port=${PORT:8080}
server.shutdown=graceful

# Entra ID OIDC settings are configured programmatically in SecurityConfig.
# Set AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID (or WEBAPP_* variants)
# to enable authentication. When absent the app starts in no-auth mode (local dev).

# Suppress spurious ERROR-level log that the Azure Data Tables SDK emits for handled
# HTTP 4xx responses (e.g. 409 TableAlreadyExists during createTable).
logging.level.com.azure.data.tables.TableClient=WARN

# Show useful diagnostics on the custom /error page.
server.error.include-message=always
server.error.include-exception=true
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param