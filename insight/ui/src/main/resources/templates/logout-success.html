<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signed Out</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<div class="shell">
    <header class="top-banner glass">
        <div>
            <div class="eyebrow">Extract Insight Action</div>
            <h1>Signed Out</h1>
            <p class="subtitle">Your application session has been cleared.</p>
        </div>
    </header>

    <section class="detail-panel glass" style="margin-top: 24px;">
        <h2 style="margin-top: 0;">Logout Complete</h2>
        <p>You can sign in again to continue reviewing emails.</p>
        <div style="display: flex; gap: 10px; margin-top: 14px;">
            <a class="profile-action-link" th:href="@{/}">Sign In Again</a>
        </div>
    </section>
</div>
</body>
</html>
